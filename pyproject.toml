[project]
name = "sdp-mcp"
version = "0.1.0"
description = "Local MCP server for ManageEngine ServiceDesk Plus Cloud (Private Site) API v3"
requires-python = ">=3.10"
license = "PolyForm-Noncommercial-1.0.0"
dependencies = [
    "mcp>=2,<3",
    "httpx2>=2.5.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
sdp-mcp = "sdp_mcp:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["sdp_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
